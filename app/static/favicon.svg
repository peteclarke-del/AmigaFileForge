<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Amiga File Forge</title>
  <defs>
    <clipPath id="ball"><circle cx="44" cy="40" r="15"/></clipPath>
  </defs>
  <!-- Workbench window frame -->
  <rect x="3" y="7" width="58" height="50" rx="4" fill="#0b2a52"/>
  <rect x="3" y="7" width="58" height="9" rx="2" fill="#0055aa"/>
  <rect x="6" y="9.5" width="5" height="4" rx="1" fill="#ffffff" stroke="#0b2a52" stroke-width="1"/>
  <rect x="49" y="9.5" width="4" height="4" rx="1" fill="#ff8800" stroke="#0b2a52" stroke-width="1"/>
  <rect x="54" y="9.5" width="4" height="4" rx="1" fill="#ffffff" stroke="#0b2a52" stroke-width="1"/>
  <rect x="6" y="19" width="52" height="35" rx="2" fill="#a9b0c0"/>

  <!-- 3.5 inch floppy -->
  <rect x="9" y="22" width="26" height="29" rx="2" fill="#22283a" stroke="#0b2a52" stroke-width="1.5"/>
  <rect x="14" y="22" width="16" height="12" rx="1" fill="#c9ccd4"/>
  <rect x="19" y="22" width="9" height="12" fill="#8b90a0"/>
  <rect x="13" y="38" width="18" height="12" rx="1" fill="#eef0f5"/>
  <rect x="15" y="41" width="14" height="1.6" fill="#5a6070"/>
  <rect x="15" y="44" width="10" height="1.6" fill="#5a6070"/>
  <rect x="15" y="47" width="12" height="1.6" fill="#5a6070"/>

  <!-- Boing ball -->
  <circle cx="44" cy="40" r="15" fill="#ffffff" stroke="#0b2a52" stroke-width="1.5"/>
  <g clip-path="url(#ball)" fill="#e4342b">
    <rect x="29" y="25" width="5" height="5"/><rect x="39" y="25" width="5" height="5"/><rect x="49" y="25" width="5" height="5"/>
    <rect x="34" y="30" width="5" height="5"/><rect x="44" y="30" width="5" height="5"/><rect x="54" y="30" width="5" height="5"/>
    <rect x="29" y="35" width="5" height="5"/><rect x="39" y="35" width="5" height="5"/><rect x="49" y="35" width="5" height="5"/>
    <rect x="34" y="40" width="5" height="5"/><rect x="44" y="40" width="5" height="5"/><rect x="54" y="40" width="5" height="5"/>
    <rect x="29" y="45" width="5" height="5"/><rect x="39" y="45" width="5" height="5"/><rect x="49" y="45" width="5" height="5"/>
    <rect x="34" y="50" width="5" height="5"/><rect x="44" y="50" width="5" height="5"/><rect x="54" y="50" width="5" height="5"/>
  </g>
  <circle cx="44" cy="40" r="15" fill="none" stroke="#0b2a52" stroke-width="1.5"/>
  <ellipse cx="39" cy="35" rx="5" ry="3.5" fill="#ffffff" opacity=".45"/>
</svg>
