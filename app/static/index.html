<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#9ea3b2">
  <title>Amiga File Forge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20260904.1">
  <link rel="stylesheet" href="/theme.css?v=20260904.1">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Amiga File Forge home">
      <img class="brand-mark" src="/favicon.svg" alt="">
      <span><strong>Amiga File Forge</strong><small>AMIGA FILE IMAGE WORKSHOP</small></span>
    </a>
    <div class="top-actions">
      <button class="theme-toggle" id="workbenchButton" type="button"><span aria-hidden="true">⌘</span><b>Workbench</b></button>
      <button class="theme-toggle jobs-button" id="jobsButton" type="button"><span aria-hidden="true">◴</span><b>Jobs</b><i id="jobsBadge" hidden>0</i></button>
      <button class="theme-toggle" id="workspaceSearchButton" type="button"><span aria-hidden="true">⌕</span><b>Search</b></button>
      <button class="theme-toggle" id="collectionButton" type="button"><span aria-hidden="true">▦</span><b>Collection</b></button>
      <button class="theme-toggle add-pane" id="addPaneButton" type="button"><span aria-hidden="true">＋</span><b>Add Pane</b></button>
      <details class="top-help-menu" id="helpMenu">
        <summary class="theme-toggle"><span aria-hidden="true">?</span><b>Help</b></summary>
        <nav class="top-help-menu-panel" aria-label="Help actions">
          <button id="helpGuideButton" type="button"><span aria-hidden="true">▤</span><b>Handbook</b></button>
          <button id="aboutButton" type="button"><span aria-hidden="true">ⓘ</span><b>About Amiga File Forge</b></button>
        </nav>
      </details>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode"><span aria-hidden="true">◐</span><b>Dark</b></button>
    </div>
  </header>

  <main id="workspace" tabindex="-1">
    <section class="workspace" aria-label="Amiga media image workspace">
      <div class="panes">
        <article class="pane" data-pane="0"></article>
        <div class="pane-taskbar" id="paneTaskbar" role="toolbar" aria-label="Minimised panes" hidden></div>
      </div>
    </section>
  </main>

  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <dialog id="modal" aria-label="Amiga File Forge dialog">
    <form method="dialog">
      <button class="modal-close" value="cancel" aria-label="Close">×</button>
      <div id="modalContent"></div>
      <div id="modalProgress" role="status" aria-live="polite">
        <span class="modal-progress-icon" aria-hidden="true">↻</span>
        <h2 id="modalProgressTitle">Operation in progress</h2>
        <p id="modalProgressMessage">Starting operation…</p>
        <div id="modalProgressDetails" class="modal-progress-details"></div>
        <span class="progress" id="modalProgressBar"><i></i></span>
        <small id="modalProgressCount"></small>
        <button id="modalAbort" class="button danger modal-abort" type="button" hidden disabled>Abort operation</button>
      </div>
      <div id="modalError" class="modal-error" role="alert" aria-live="assertive">
        <span class="modal-error-icon" aria-hidden="true">!</span>
        <h2>Operation could not be completed</h2>
        <p id="modalErrorMessage"></p>
        <div id="modalErrorDetails" class="modal-progress-details"></div>
        <div class="modal-actions">
          <button id="modalErrorBack" class="button" type="button">Back / retry</button>
          <button id="modalErrorClose" class="button primary" type="button">Close</button>
        </div>
      </div>
    </form>
  </dialog>

  <template id="emptyPane">
    <div class="empty-pane">
      <div class="empty-pane-window-actions">
        <button class="icon-button minimize-pane" type="button" title="Minimise Pane" aria-label="Minimise Pane">−</button>
        <button class="icon-button maximize-pane" type="button" title="Maximise Pane" aria-label="Maximise Pane" aria-pressed="false">□</button>
        <button class="icon-button close-empty-pane" type="button" title="Close Pane" aria-label="Close Pane">×</button>
      </div>
      <div class="disk-illustration"><span></span><b></b></div>
      <h2>Open an image here</h2>
      <p>Choose an existing image, create a blank one, or drop an image here.</p>
      <div class="empty-actions">
        <button class="button primary pane-open">Open image</button>
        <button class="button pane-new">Create new image</button>
        <button class="button pane-recover">Recover previous session</button>
      </div>
      <small>AMIGA 500 / 600 · AMIGA 1200 / 4000 · AMIGAOS 1.3 - 3.x</small>
    </div>
  </template>

  <script src="/formats.js?v=20260731.19"></script>
  <script src="/identifiers.js?v=20260815.1"></script>
  <script src="/core.js?v=20260814.1"></script>
  <script src="/workspace.js?v=20260816.1"></script>
  <script src="/editor-workspace.js?v=20260814.1"></script>
  <script src="/workspace-persistence.js?v=20260816.1"></script>
  <script src="/pane-window-manager.js?v=20260816.3"></script>
  <script src="/operation-ui.js?v=20260816.1"></script>
  <script src="/file-visuals.js?v=20260827.1"></script>
  <script src="/import-planning.js?v=20260814.1"></script>
  <script src="/amiga-metadata.js?v=20260815.2"></script>
  <script src="/pane-view.js?v=20260814.1"></script>
  <script src="/transfer-planning.js?v=20260814.1"></script>
  <script src="/safety-dialogs.js?v=20260814.1"></script>
  <script src="/collection-catalogue.js?v=20260817.1"></script>
  <script src="/help.js?v=20260818.1"></script>
  <script src="/about.js?v=20260825.1"></script>
  <script src="/hex-editor.js?v=20260813.4"></script>
  <script src="/basic-language.js?v=20260812.3"></script>
  <script src="/assembly-language.js?v=20260812.1"></script>
  <script src="/amiga-call-catalogue.js?v=20260813.1"></script>
  <script src="/code-editor.js?v=20260813.34"></script>
  <script src="/app.js?v=20260827.1"></script>
</body>
</html>
