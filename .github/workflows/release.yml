name: Release packages

on:
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - packaging/linux/**
      - tools/build-linux-package.sh
      - tools/build-hxc-runtime.sh
      - tools/build-source-archive.sh
      - tools/build-release.sh
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Build source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag and application version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Build source archive
        run: tools/build-source-archive.sh release

      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: release/*.tar.gz
          if-no-files-found: error

  linux-packages:
    name: ${{ matrix.distro.label }} ${{ matrix.arch.debian }} package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro:
          - id: deb13
            label: Debian 13
            image: debian:trixie-slim
          - id: ubuntu24.04
            label: Ubuntu 24.04
            image: ubuntu:24.04
        arch:
          - platform: linux/amd64
            debian: amd64
          - platform: linux/arm64
            debian: arm64
          - platform: linux/arm/v7
            debian: armhf
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - name: Restore package download cache
        uses: actions/cache@v5
        with:
          path: .release-cache/${{ matrix.distro.id }}-${{ matrix.arch.debian }}
          key: release-pip-${{ matrix.distro.id }}-${{ matrix.arch.debian }}-${{ hashFiles('packaging/linux/requirements-debian.txt') }}

      - name: Build and inspect package
        env:
          PACKAGE_IMAGE: ${{ matrix.distro.image }}
          PACKAGE_PLATFORM: ${{ matrix.arch.platform }}
          PACKAGE_REVISION: -1~${{ matrix.distro.id }}
          PACKAGE_TARGET: ${{ matrix.distro.label }}
          PACKAGE_ARCHITECTURE: ${{ matrix.arch.debian }}
        run: |
          mkdir -p release ".release-cache/${{ matrix.distro.id }}-${{ matrix.arch.debian }}"
          docker run --rm \
            --platform "$PACKAGE_PLATFORM" \
            --env AMIGA_PACKAGE_REVISION="$PACKAGE_REVISION" \
            --env AMIGA_PACKAGE_TARGET="$PACKAGE_TARGET" \
            --env EXPECTED_ARCHITECTURE="$PACKAGE_ARCHITECTURE" \
            --env EXPECTED_PACKAGE_TARGET="$PACKAGE_TARGET" \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "${{ github.workspace }}:/source" \
            --volume "${{ github.workspace }}/.release-cache/${{ matrix.distro.id }}-${{ matrix.arch.debian }}:/root/.cache/pip" \
            --workdir /source \
            "$PACKAGE_IMAGE" \
            sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends build-essential ca-certificates dpkg-dev git gzip python3 python3-dev python3-pip
              git config --global --add safe.directory /source
              tools/build-linux-package.sh /source/release
              package=$(find /source/release -maxdepth 1 -name "*.deb" -print -quit)
              test -n "$package"
              test "$(dpkg-deb --field "$package" Architecture)" = "$EXPECTED_ARCHITECTURE"
              test "$(dpkg-deb --field "$package" X-Amiga-Target)" = "$EXPECTED_PACKAGE_TARGET"
              stage=$(mktemp -d)
              dpkg-deb --extract "$package" "$stage"
              cd "$stage/opt/amiga-file-forge"
              PYTHONPATH="$stage/opt/amiga-file-forge/vendor:$stage/opt/amiga-file-forge" python3 -c "import flask; import amiganut.ffs; import amiganut.kickfs; from capstone import CS_ARCH_ARM, CS_ARCH_M68K, CS_ARCH_M68K, Cs; Cs(CS_ARCH_ARM, 0); Cs(CS_ARCH_M68K, 0); Cs(CS_ARCH_M68K, 0); from app.server import create_app; print(\"Package runtime gate passed\")"
              LD_LIBRARY_PATH="$stage/opt/amiga-file-forge/native/lib" "$stage/opt/amiga-file-forge/native/bin/hxcfe" -help >/dev/null
              rm -rf "$stage"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.distro.id }}-${{ matrix.arch.debian }}
          path: release/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - source
      - linux-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        run: cd release && sha256sum ./* | sort --key=2 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --title "Amiga File Forge $(cat VERSION)"
          --notes-file "docs/releases/$(cat VERSION).md"
          --verify-tag
